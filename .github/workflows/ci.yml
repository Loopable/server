name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: src

jobs:
  verify:
    name: unit, vet, race, fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: whitespace check
        run: git diff --check
      - name: race-enabled test run
        run: go test -race ./...
      - name: fuzz smoke (30s per target)
        run: |
          for target in \
            encoding:FuzzDecode \
            events:FuzzParseWire \
            objects:FuzzEnvelope \
            instance:FuzzParseDocument \
            identifiers:FuzzParse \
            federation:FuzzAuthorization \
            federation:FuzzCanonical \
            accounts:FuzzFirstDevice \
            mls:FuzzCredentials \
            sync:FuzzParseRequest \
            sync:FuzzParsePage; do
            pkg="${target%%:*}"; name="${target##*:}"
            echo "fuzzing protocol/$pkg $name"
            go test "./internal/protocol/$pkg/" -run '^$' -fuzz "$name" -fuzztime 30s || exit 1
          done

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPABLE_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - run: go test -race ./internal/store/
      - run: go test -race ./internal/objectstore/

  s3:
    name: s3-compatible object store integration
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOPABLE_TEST_S3: "1"
      LOOPABLE_TEST_S3_BUCKET: loopable-test
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_ENDPOINT_URL_S3: http://localhost:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: create bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_minio=http://minioadmin:minioadmin@localhost:9000 \
            minio/mc mb -p minio/loopable-test
      - run: go test -race ./internal/objectstore/ -run 'TestS3'

  crossbuild:
    name: build and unit on ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - run: go build ./...
      - run: go test ./...